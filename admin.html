<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sri Lakshmi - Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;
        }


        header {
            background: #111;

            color: white;

            padding: 20px;

            text-align: center;
        }


        header button {

            padding: 10px 20px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .dashboard {

            max-width: 1200px;

            margin: 30px auto;

            padding: 20px;

        }


        .dashboard h2 {

            margin-top: 40px;

        }


        .cards {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }


        .summary-card {

            background: white;

            padding: 25px;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);

        }


        .summary-card h3 {

            font-size: 30px;

            margin: 10px 0;

        }


        .review-card,
        .enquiry-card,
        .order-card {

            background: white;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.08);

        }


        .stars {

            font-size: 20px;

        }


        .customer-name {

            font-weight: bold;

            font-size: 18px;

        }


        .date {

            color: #777;

            font-size: 13px;

            margin-top: 10px;

        }


        .message {

            margin-top: 12px;

            line-height: 1.5;

        }


        /* =========================
           ORDERS
        ========================= */


        .order-card {

            border-left: 5px solid #ff9800;

        }


        .order-card h3 {

            margin-top: 0;

            font-size: 22px;

        }


        .order-info {

            line-height: 1.7;

        }


        .order-items {

            margin: 15px 0;

            padding: 15px;

            background: #f8f8f8;

            border-radius: 8px;

        }


        .order-item {

            display: flex;

            justify-content: space-between;

            padding: 8px 0;

            border-bottom: 1px solid #ddd;

        }


        .order-item:last-child {

            border-bottom: none;

        }


        .order-total {

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

        }


        .order-status {

            display: inline-block;

            padding: 6px 12px;

            margin-left: 5px;

            border-radius: 6px;

            background: #fff3cd;

            font-weight: bold;

        }


        .order-buttons {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;

        }


        .order-buttons button {

            padding: 9px 15px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            background: #ff9800;

            color: white;

            font-weight: bold;

        }


        .order-buttons button:hover {

            opacity: 0.85;

        }


        .order-buttons .cancel {

            background: #d32f2f;

        }


        .refresh-button {

            padding: 10px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            background: #111;

            color: white;

            margin-bottom: 20px;

        }


        @media (max-width: 768px) {

            .cards {

                grid-template-columns: 1fr;

            }


            .order-item {

                flex-direction: column;

                gap: 5px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->


<header>

    <h1>Sri Lakshmi Restaurant</h1>

    <p>Admin Dashboard</p>


    <button onclick="logout()">

        Logout

    </button>

</header>



<div class="dashboard">


    <!-- =========================
         SUMMARY
    ========================= -->


    <div class="cards">


        <div class="summary-card">

            <p>Total Reviews</p>

            <h3 id="review-count">
                0
            </h3>

        </div>


        <div class="summary-card">

            <p>Total Enquiries</p>

            <h3 id="enquiry-count">
                0
            </h3>

        </div>


        <div class="summary-card">

            <p>Total Orders</p>

            <h3 id="order-count">
                0
            </h3>

        </div>


    </div>



    <!-- =========================
         REVIEWS
    ========================= -->


    <h2>
        ⭐ Customer Reviews
    </h2>


    <div id="admin-reviews">

        <p>
            Loading reviews...
        </p>

    </div>



    <!-- =========================
         ENQUIRIES
    ========================= -->


    <h2>
        📩 Customer Enquiries
    </h2>


    <div id="admin-enquiries">

        <p>
            Loading enquiries...
        </p>

    </div>



    <!-- =========================
         ORDERS
    ========================= -->


    <h2>
        📦 Customer Orders
    </h2>


    <button
        class="refresh-button"
        onclick="loadOrders()">

        🔄 Refresh Orders

    </button>


    <div id="orders-container">

        <p>
            Loading orders...
        </p>

    </div>


</div>



<script>


// =====================================
// API
// =====================================


const API =
    "http://127.0.0.1:5000";


const TOKEN =
    localStorage.getItem(
        "admin_token"
    );


// =====================================
// CHECK LOGIN
// =====================================


if (!TOKEN) {

    window.location.href =
        "admin-login.html";

}



// =====================================
// LOAD REVIEWS
// =====================================


async function loadReviews() {


    const container =
        document.getElementById(
            "admin-reviews"
        );


    try {


        const response =
            await fetch(

                API +
                "/api/reviews",

                {

                    headers: {

                        "Authorization":
                            "Bearer " +
                            TOKEN

                    }

                }

            );


        if (response.status === 401) {

            logout();

            return;

        }


        const reviews =
            await response.json();


        document.getElementById(
            "review-count"
        ).textContent =
            reviews.length;


        container.innerHTML = "";


        if (reviews.length === 0) {

            container.innerHTML =
                "<p>No reviews yet.</p>";

            return;

        }


        reviews.forEach(
            review => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "review-card";


                const stars =
                    "★".repeat(
                        review.rating
                    ) +

                    "☆".repeat(
                        5 -
                        review.rating
                    );


                card.innerHTML = `

                    <div
                        class="customer-name">

                        ${review.name}

                    </div>


                    <div class="stars">

                        ${stars}

                    </div>


                    <div class="message">

                        "${review.review}"

                    </div>


                    <div class="date">

                        ${review.created_at}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }

    catch (error) {


        console.error(error);


        container.innerHTML =

            "<p>" +
            "Unable to load reviews." +
            "</p>";

    }

}



// =====================================
// LOAD ENQUIRIES
// =====================================


async function loadEnquiries() {


    const container =
        document.getElementById(
            "admin-enquiries"
        );


    try {


        const response =
            await fetch(

                API +
                "/api/enquiries",

                {

                    headers: {

                        "Authorization":
                            "Bearer " +
                            TOKEN

                    }

                }

            );


        if (response.status === 401) {

            logout();

            return;

        }


        const enquiries =
            await response.json();


        document.getElementById(
            "enquiry-count"
        ).textContent =
            enquiries.length;


        container.innerHTML = "";


        if (enquiries.length === 0) {

            container.innerHTML =
                "<p>No enquiries yet.</p>";

            return;

        }


        enquiries.forEach(
            enquiry => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "enquiry-card";


                card.innerHTML = `

                    <div
                        class="customer-name">

                        ${enquiry.name}

                    </div>


                    <p>

                        📞
                        ${enquiry.phone}

                    </p>


                    <p>

                        ✉️
                        ${
                            enquiry.email ||
                            "No email"
                        }

                    </p>


                    <div class="message">

                        ${enquiry.message}

                    </div>


                    <div class="date">

                        ${enquiry.created_at}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }

    catch (error) {


        console.error(error);


        container.innerHTML =

            "<p>" +
            "Unable to load enquiries." +
            "</p>";

    }

}



// =====================================
// LOAD ORDERS
// =====================================


async function loadOrders() {


    const container =
        document.getElementById(
            "orders-container"
        );


    try {


        const response =
            await fetch(

                API +
                "/api/orders",

                {

                    headers: {

                        "Authorization":
                            "Bearer " +
                            TOKEN

                    }

                }

            );


        if (response.status === 401) {

            logout();

            return;

        }


        const orders =
            await response.json();


        document.getElementById(
            "order-count"
        ).textContent =
            orders.length;


        container.innerHTML = "";


        if (orders.length === 0) {

            container.innerHTML = `

                <div class="order-card">

                    <p>
                        📦 No orders yet.
                    </p>

                </div>

            `;

            return;

        }


        orders.forEach(
            order => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                // Build items


                let itemsHTML = "";


                order.items.forEach(
                    item => {


                        const itemTotal =
                            item.price *
                            item.quantity;


                        itemsHTML += `

                            <div
                                class="order-item">

                                <span>

                                    ${item.name}

                                    ×

                                    ${item.quantity}

                                </span>


                                <strong>

                                    ₹${itemTotal}

                                </strong>

                            </div>

                        `;

                    }
                );


                card.innerHTML = `

                    <h3>

                        📦 Order #${order.id}

                    </h3>


                    <div
                        class="order-info">

                        <p>

                            <strong>
                                Customer:
                            </strong>

                            ${order.name}

                        </p>


                        <p>

                            <strong>
                                Phone:
                            </strong>

                            ${order.phone}

                        </p>


                        <p>

                            <strong>
                                Address:
                            </strong>

                            ${order.address}

                        </p>


                        <p>

                            <strong>
                                Payment:
                            </strong>

                            ${order.payment_method}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>

                            <span
                                class="order-status">

                                ${order.status}

                            </span>

                        </p>

                    </div>


                    <h4>
                        Ordered Items
                    </h4>


                    <div class="order-items">

                        ${itemsHTML}

                    </div>


                    <div
                        class="order-total">

                        Total:
                        ₹${order.total}

                    </div>


                    <div class="date">

                        Ordered:
                        ${order.created_at}

                    </div>


                    <div
                        class="order-buttons">


                        <button
                            onclick="
                            updateOrderStatus(
                                ${order.id},
                                'ACCEPTED'
                            )">

                            Accept

                        </button>


                        <button
                            onclick="
                            updateOrderStatus(
                                ${order.id},
                                'PREPARING'
                            )">

                            Preparing

                        </button>


                        <button
                            onclick="
                            updateOrderStatus(
                                ${order.id},
                                'READY'
                            )">

                            Ready

                        </button>


                        <button
                            onclick="
                            updateOrderStatus(
                                ${order.id},
                                'DELIVERED'
                            )">

                            Delivered

                        </button>


                        <button
                            class="cancel"
                            onclick="
                            updateOrderStatus(
                                ${order.id},
                                'CANCELLED'
                            )">

                            Cancel

                        </button>


                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }

    catch (error) {


        console.error(error);


        container.innerHTML = `

            <div class="order-card">

                <p>
                    ❌ Unable to load orders.
                </p>

                <p>
                    Check that your Flask
                    backend is running.
                </p>

            </div>

        `;

    }

}



// =====================================
// UPDATE ORDER STATUS
// =====================================


async function updateOrderStatus(
    orderId,
    status
) {


    try {


        const response =
            await fetch(

                API +
                "/api/orders/" +
                orderId,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            TOKEN

                    },


                    body:
                        JSON.stringify({

                            status:
                                status

                        })

                }

            );


        if (response.status === 401) {

            logout();

            return;

        }


        const result =
            await response.json();


        if (!response.ok) {

            alert(

                result.error ||
                "Could not update order."

            );

            return;

        }


        alert(

            "Order #" +
            orderId +
            " changed to " +
            status

        );


        loadOrders();


    }

    catch (error) {


        console.error(error);


        alert(
            "Could not connect to server."
        );

    }

}



// =====================================
// LOGOUT
// =====================================


async function logout() {


    try {


        await fetch(

            API +
            "/api/logout",

            {

                method: "POST",

                headers: {

                    "Authorization":
                        "Bearer " +
                        TOKEN

                }

            }

        );

    }

    catch (error) {

        console.error(error);

    }


    localStorage.removeItem(
        "admin_token"
    );


    window.location.href =
        "admin-login.html";

}



// =====================================
// START DASHBOARD
// =====================================


loadReviews();

loadEnquiries();

loadOrders();


</script>


</body>

</html>
