<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sri Lakshmi - Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;

            color: white;

            padding: 25px 20px;

            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;

            font-size: 42px;
        }

        header p {
            margin: 10px 0 20px;

            font-size: 18px;
        }

        header button {
            padding: 11px 25px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            background: white;

            color: #111;
        }

        header button:hover {
            opacity: 0.85;
        }

        /* =========================
           DASHBOARD
        ========================= */

        .dashboard {
            max-width: 1200px;

            margin: 30px auto;

            padding: 20px;
        }

        /* =========================
           SUMMARY CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 35px;
        }

        .summary-card {
            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }

        .summary-card p {
            color: #777;

            font-size: 17px;
        }

        .summary-card h3 {
            font-size: 32px;

            margin: 10px 0 0;

            color: #111;
        }

        /* =========================
           SECTION HEADINGS
        ========================= */

        .dashboard h2 {
            margin-top: 45px;

            margin-bottom: 18px;

            font-size: 28px;
        }

        /* =========================
           COMMON CARDS
        ========================= */

        .review-card,
        .enquiry-card,
        .order-card {
            background: white;

            padding: 22px;

            margin-bottom: 15px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);
        }

        /* =========================
           REVIEWS
        ========================= */

        .review-card {
            border-left: 5px solid #ff9800;
        }

        .customer-name {
            font-weight: bold;

            font-size: 19px;

            margin-bottom: 10px;
        }

        .stars {
            font-size: 22px;

            margin-bottom: 12px;
        }

        .message {
            line-height: 1.6;

            margin-top: 10px;
        }

        .date {
            color: #777;

            font-size: 13px;

            margin-top: 12px;
        }

        /* =========================
           ENQUIRIES
        ========================= */

        .enquiry-card {
            border-left: 5px solid #2196f3;
        }

        .enquiry-card p {
            margin: 10px 0;
        }

        /* =========================
           ORDERS
        ========================= */

        .order-card {
            border-left: 5px solid #ff9800;
        }

        .order-card h3 {
            margin-top: 0;

            font-size: 22px;
        }

        .order-info {
            line-height: 1.7;
        }

        .order-items {
            margin: 15px 0;

            padding: 15px;

            background: #f8f8f8;

            border-radius: 8px;
        }

        .order-item {
            display: flex;

            justify-content: space-between;

            padding: 9px 0;

            border-bottom:
                1px solid #ddd;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-total {
            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;
        }

        .order-status {
            display: inline-block;

            padding: 6px 12px;

            margin-left: 5px;

            border-radius: 6px;

            background: #fff3cd;

            font-weight: bold;
        }

        /* =========================
           ORDER BUTTONS
        ========================= */

        .order-buttons {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }

        .order-buttons button {
            padding: 9px 15px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            background: #ff9800;

            color: white;

            font-weight: bold;
        }

        .order-buttons button:hover {
            opacity: 0.85;
        }

        .order-buttons .cancel {
            background: #d32f2f;
        }

        /* =========================
           REFRESH BUTTON
        ========================= */

        .refresh-button {
            padding: 11px 20px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            background: #111;

            color: white;

            margin-bottom: 20px;

            font-weight: bold;
        }

        .refresh-button:hover {
            opacity: 0.85;
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            background: #fff;

            border-left: 5px solid red;

            padding: 20px;

            margin-bottom: 15px;

            border-radius: 8px;

            color: #b00020;
        }

        .loading {
            color: #777;

            padding: 15px 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            header h1 {
                font-size: 30px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .dashboard {
                padding: 15px;
            }

            .order-item {
                flex-direction: column;

                gap: 5px;
            }

            .order-buttons {
                flex-direction: column;
            }

            .order-buttons button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


<header>

    <h1>
        Sri Lakshmi Restaurant
    </h1>

    <p>
        Admin Dashboard
    </p>

    <button onclick="logout()">
        Logout
    </button>

</header>


<div class="dashboard">


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="cards">


        <div class="summary-card">

            <p>
                Total Reviews
            </p>

            <h3 id="review-count">
                0
            </h3>

        </div>


        <div class="summary-card">

            <p>
                Total Enquiries
            </p>

            <h3 id="enquiry-count">
                0
            </h3>

        </div>


        <div class="summary-card">

            <p>
                Total Orders
            </p>

            <h3 id="order-count">
                0
            </h3>

        </div>


    </div>


    <!-- =========================
         REVIEWS
    ========================= -->

    <h2>
        ⭐ Customer Reviews
    </h2>

    <div id="admin-reviews">

        <p class="loading">
            Loading reviews...
        </p>

    </div>


    <!-- =========================
         ENQUIRIES
    ========================= -->

    <h2>
        📩 Customer Enquiries
    </h2>

    <div id="admin-enquiries">

        <p class="loading">
            Loading enquiries...
        </p>

    </div>


    <!-- =========================
         ORDERS
    ========================= -->

    <h2>
        📦 Customer Orders
    </h2>


    <button
        class="refresh-button"
        onclick="loadOrders()"
    >
        🔄 Refresh Orders
    </button>


    <div id="orders-container">

        <p class="loading">
            Loading orders...
        </p>

    </div>


</div>


<script>


// =====================================
// BACKEND URL
// =====================================

// IMPORTANT:
// GitHub Pages = frontend
// Render = backend

const API =
    "https://sri-lakshmi-restaurant-backend.onrender.com";


const TOKEN =
    localStorage.getItem(
        "admin_token"
    );


// =====================================
// CHECK LOGIN
// =====================================

if (!TOKEN) {

    window.location.href =
        "admin-login.html";

}


// =====================================
// COMMON FETCH FUNCTION
// =====================================

async function apiFetch(
    endpoint,
    options = {}
) {

    const headers = {

        ...(options.headers || {}),

        "Authorization":
            "Bearer " + TOKEN

    };


    const response =
        await fetch(
            API + endpoint,
            {
                ...options,
                headers: headers
            }
        );


    if (response.status === 401) {

        localStorage.removeItem(
            "admin_token"
        );

        window.location.href =
            "admin-login.html";

        throw new Error(
            "Unauthorized"
        );

    }


    return response;

}


// =====================================
// LOAD REVIEWS
// =====================================

async function loadReviews() {

    const container =
        document.getElementById(
            "admin-reviews"
        );


    try {

        const response =
            await apiFetch(
                "/api/reviews"
            );


        const reviews =
            await response.json();


        if (!response.ok) {

            throw new Error(
                reviews.error ||
                "Unable to load reviews."
            );

        }


        document.getElementById(
            "review-count"
        ).textContent =
            reviews.length;


        container.innerHTML = "";


        if (
            !Array.isArray(reviews) ||
            reviews.length === 0
        ) {

            container.innerHTML =
                "<p>No reviews yet.</p>";

            return;

        }


        reviews.forEach(
            function(review) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "review-card";


                const rating =
                    Number(
                        review.rating
                    ) || 0;


                const stars =
                    "★".repeat(
                        rating
                    ) +
                    "☆".repeat(
                        5 - rating
                    );


                card.innerHTML = `

                    <div
                        class="customer-name"
                    >
                        ${escapeHTML(
                            review.name
                        )}
                    </div>

                    <div class="stars">
                        ${stars}
                    </div>

                    <div class="message">
                        "${escapeHTML(
                            review.review
                        )}"
                    </div>

                    <div class="date">
                        ${escapeHTML(
                            review.created_at ||
                            ""
                        )}
                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Reviews error:",
            error
        );


        if (
            error.message ===
            "Unauthorized"
        ) {

            return;

        }


        container.innerHTML = `

            <div class="error-box">

                ❌ Unable to load reviews.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


// =====================================
// LOAD ENQUIRIES
// =====================================

async function loadEnquiries() {

    const container =
        document.getElementById(
            "admin-enquiries"
        );


    try {

        const response =
            await apiFetch(
                "/api/enquiries"
            );


        const enquiries =
            await response.json();


        if (!response.ok) {

            throw new Error(
                enquiries.error ||
                "Unable to load enquiries."
            );

        }


        document.getElementById(
            "enquiry-count"
        ).textContent =
            enquiries.length;


        container.innerHTML = "";


        if (
            !Array.isArray(enquiries) ||
            enquiries.length === 0
        ) {

            container.innerHTML =
                "<p>No enquiries yet.</p>";

            return;

        }


        enquiries.forEach(
            function(enquiry) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "enquiry-card";


                card.innerHTML = `

                    <div
                        class="customer-name"
                    >
                        ${escapeHTML(
                            enquiry.name
                        )}
                    </div>

                    <p>
                        📞
                        ${escapeHTML(
                            enquiry.phone
                        )}
                    </p>

                    <p>
                        ✉️
                        ${escapeHTML(
                            enquiry.email ||
                            "No email"
                        )}
                    </p>

                    <div class="message">

                        ${escapeHTML(
                            enquiry.message
                        )}

                    </div>

                    <div class="date">

                        ${escapeHTML(
                            enquiry.created_at ||
                            ""
                        )}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Enquiries error:",
            error
        );


        if (
            error.message ===
            "Unauthorized"
        ) {

            return;

        }


        container.innerHTML = `

            <div class="error-box">

                ❌ Unable to load enquiries.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


// =====================================
// LOAD ORDERS
// =====================================

async function loadOrders() {

    const container =
        document.getElementById(
            "orders-container"
        );


    container.innerHTML =
        "<p class='loading'>Loading orders...</p>";


    try {

        const response =
            await apiFetch(
                "/api/orders"
            );


        const orders =
            await response.json();


        if (!response.ok) {

            throw new Error(
                orders.error ||
                "Unable to load orders."
            );

        }


        document.getElementById(
            "order-count"
        ).textContent =
            orders.length;


        container.innerHTML = "";


        if (
            !Array.isArray(orders) ||
            orders.length === 0
        ) {

            container.innerHTML = `

                <div class="order-card">

                    <p>
                        📦 No orders yet.
                    </p>

                </div>

            `;

            return;

        }


        orders.forEach(
            function(order) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                let itemsHTML = "";


                const items =
                    Array.isArray(
                        order.items
                    )
                    ? order.items
                    : [];


                items.forEach(
                    function(item) {

                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const quantity =
                            Number(
                                item.quantity
                            ) || 0;


                        const itemTotal =
                            price *
                            quantity;


                        itemsHTML += `

                            <div
                                class="order-item"
                            >

                                <span>

                                    ${escapeHTML(
                                        item.name ||
                                        "Item"
                                    )}

                                    ×

                                    ${quantity}

                                </span>


                                <strong>

                                    ₹${itemTotal}

                                </strong>

                            </div>

                        `;

                    }
                );


                card.innerHTML = `

                    <h3>

                        📦 Order #${escapeHTML(
                            String(order.id)
                        )}

                    </h3>


                    <div
                        class="order-info"
                    >

                        <p>

                            <strong>
                                Customer:
                            </strong>

                            ${escapeHTML(
                                order.name
                            )}

                        </p>


                        <p>

                            <strong>
                                Phone:
                            </strong>

                            ${escapeHTML(
                                order.phone
                            )}

                        </p>


                        <p>

                            <strong>
                                Address:
                            </strong>

                            ${escapeHTML(
                                order.address
                            )}

                        </p>


                        <p>

                            <strong>
                                Payment:
                            </strong>

                            ${escapeHTML(
                                order.payment_method
                            )}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>

                            <span
                                class="order-status"
                            >
                                ${escapeHTML(
                                    order.status
                                )}
                            </span>

                        </p>

                    </div>


                    <h4>
                        Ordered Items
                    </h4>


                    <div
                        class="order-items"
                    >

                        ${
                            itemsHTML ||
                            "<p>No items found.</p>"
                        }

                    </div>


                    <div
                        class="order-total"
                    >

                        Total:
                        ₹${escapeHTML(
                            String(
                                order.total
                            )
                        )}

                    </div>


                    <div class="date">

                        Ordered:
                        ${escapeHTML(
                            order.created_at ||
                            ""
                        )}

                    </div>


                    <div
                        class="order-buttons"
                    >

                        <button
                            onclick="
                                updateOrderStatus(
                                    ${order.id},
                                    'ACCEPTED'
                                )
                            "
                        >
                            Accept
                        </button>


                        <button
                            onclick="
                                updateOrderStatus(
                                    ${order.id},
                                    'PREPARING'
                                )
                            "
                        >
                            Preparing
                        </button>


                        <button
                            onclick="
                                updateOrderStatus(
                                    ${order.id},
                                    'READY'
                                )
                            "
                        >
                            Ready
                        </button>


                        <button
                            onclick="
                                updateOrderStatus(
                                    ${order.id},
                                    'DELIVERED'
                                )
                            "
                        >
                            Delivered
                        </button>


                        <button
                            class="cancel"
                            onclick="
                                updateOrderStatus(
                                    ${order.id},
                                    'CANCELLED'
                                )
                            "
                        >
                            Cancel
                        </button>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Orders error:",
            error
        );


        if (
            error.message ===
            "Unauthorized"
        ) {

            return;

        }


        container.innerHTML = `

            <div class="error-box">

                ❌ Unable to load orders.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


// =====================================
// UPDATE ORDER STATUS
// =====================================

async function updateOrderStatus(
    orderId,
    status
) {

    try {

        const response =
            await apiFetch(
                "/api/orders/" +
                orderId,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status:
                                status
                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Could not update order."
            );

            return;

        }


        alert(
            "Order #" +
            orderId +
            " changed to " +
            status
        );


        loadOrders();

    }

    catch (error) {

        console.error(
            error
        );


        if (
            error.message !==
            "Unauthorized"
        ) {

            alert(
                "Could not connect to server."
            );

        }

    }

}


// =====================================
// LOGOUT
// =====================================

async function logout() {

    try {

        await fetch(
            API +
            "/api/logout",
            {

                method: "POST",

                headers: {
                    "Authorization":
                        "Bearer " +
                        TOKEN
                }

            }
        );

    }

    catch (error) {

        console.error(
            error
        );

    }


    localStorage.removeItem(
        "admin_token"
    );


    window.location.href =
        "admin-login.html";

}


// =====================================
// HTML ESCAPE
// =====================================

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================
// START DASHBOARD
// =====================================

loadReviews();

loadEnquiries();

loadOrders();


</script>


</body>

</html>
