<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sri Lakshmi - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .login-box {
            width: 400px;
            max-width: 90%;

            padding: 40px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
        }

        .login-box input {
            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 16px;
        }

        .login-box button {
            width: 100%;

            padding: 14px;

            margin-top: 20px;

            background: #ff9800;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        .login-box button:hover {
            opacity: 0.9;
        }

        #login-message {
            margin-top: 20px;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="login-box">

    <h1>Sri Lakshmi</h1>

    <p>Restaurant Admin Login</p>


    <form id="login-form">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <p id="login-message"></p>

</div>


<script>

const API =
    "http://127.0.0.1:5000";


document
    .getElementById("login-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                .getElementById("username")
                .value;


            const password =
                document
                .getElementById("password")
                .value;


            const message =
                document
                .getElementById("login-message");


            try {

                const response =
                    await fetch(
                        API + "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username:
                                        username,

                                    password:
                                        password
                                })
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        result.error;

                    return;
                }


                localStorage.setItem(
                    "admin_token",
                    result.token
                );


                window.location.href =
                    "admin.html";

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Could not connect to server.";

            }

        }
    );

</script>

</body>

</html>
