<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sri Lakshmi - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }


        .login-box {

            width: 400px;

            max-width: 90%;

            padding: 40px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.15);

            text-align: center;
        }


        .login-box h1 {

            margin-bottom: 10px;

            color: #111;
        }


        .login-box p {

            color: #666;
        }


        .login-box input {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 16px;

            outline: none;
        }


        .login-box input:focus {

            border-color: #ff9800;

        }


        .login-box button {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            background: #ff9800;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }


        .login-box button:hover {

            opacity: 0.9;

        }


        .login-box button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #login-message {

            margin-top: 20px;

            font-weight: bold;

            min-height: 20px;
        }


        .success {

            color: green;

        }


        .error {

            color: red;

        }

    </style>

</head>


<body>


<div class="login-box">


    <h1>Sri Lakshmi</h1>


    <p>
        Restaurant Admin Login
    </p>


    <form id="login-form">


        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >


        <button
            type="submit"
            id="login-button"
        >
            Login
        </button>


    </form>


    <p id="login-message"></p>


</div>


<script>


// =====================================
// API
// =====================================

// IMPORTANT:
// Empty string means use the same
// server that is serving this page.
//
// Local:
// http://127.0.0.1:5000/api/login
//
// Live:
// https://sri-lakshmi-restaurant.onrender.com/api/login

const API = "";


// =====================================
// LOGIN FORM
// =====================================

const loginForm =
    document.getElementById(
        "login-form"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const message =
    document.getElementById(
        "login-message"
    );


// =====================================
// LOGIN
// =====================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById(
                "username"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "password"
            )
            .value;


        // Clear previous message

        message.textContent = "";

        message.className = "";


        // Disable button

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {


            const response =
                await fetch(
                    API + "/api/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            const result =
                await response.json();


            // =================================
            // LOGIN FAILED
            // =================================

            if (!response.ok) {

                message.textContent =
                    result.error ||
                    "Invalid username or password.";

                message.className =
                    "error";

                return;

            }


            // =================================
            // LOGIN SUCCESS
            // =================================

            localStorage.setItem(
                "admin_token",
                result.token
            );


            message.textContent =
                "Login successful!";

            message.className =
                "success";


            // Redirect to admin dashboard

            setTimeout(
                function() {

                    window.location.href =
                        "/admin.html";

                },
                500
            );


        }


        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.textContent =
                "Could not connect to server.";

            message.className =
                "error";

        }


        finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);


</script>


</body>

</html>
